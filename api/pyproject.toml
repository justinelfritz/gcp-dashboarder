[project]
name = "dashboarder-api"
version = "0.1.0"
description = "Dashboarder API: parse activity files and compute metrics on demand"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "garmin-fit-sdk>=21.218.0",
    "google-cloud-storage>=3.17.1",
    "firebase-admin>=7.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
